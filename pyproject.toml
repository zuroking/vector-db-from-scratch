[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vectordb"
version = "0.1.0"
description = "Vector database from scratch: HNSW index on pure numpy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
]

[project.optional-dependencies]
cli = [
    "typer>=0.12",
    "rich>=13.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]

[project.scripts]
vectordb = "vectordb.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vectordb"]

[tool.mypy]
python_version = "3.12"
strict = true
# Already implied by strict = true; kept explicit per project specification.
disallow_untyped_defs = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run skips long-running quality gates; `pytest -m slow` overrides.
addopts = "-ra -m 'not slow'"
markers = [
    "slow: large-scale quality gates, run explicitly via `pytest -m slow`",
]
